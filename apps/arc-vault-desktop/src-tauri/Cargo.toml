[package]
name = "arc-vault-desktop"
version = "0.0.0"
edition = "2021"
publish = false
description = "Tauri v2 desktop shell for arc-vault. Thin wrapper over crates/desktop-core."

[lib]
name = "arc_vault_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
arc-vault-crypto = { path = "../../../crates/vault-crypto-rs" }
arc-vault-desktop-core = { path = "../../../crates/desktop-core", features = ["os-keychain"] }
