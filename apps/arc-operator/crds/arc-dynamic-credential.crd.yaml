## ---------------------------------------------------------------------------
## ArcDynamicCredential — declarative issue + auto-refresh of a dynamic credential.
##
## Each reconcile, the operator computes "now + refreshLeadSeconds": if the current lease
## would expire before that, it re-issues from arc-server's /v1/<mount>/creds/<role> route
## and rewrites the target K8s Secret. The previous lease's ID is recorded in `status` and
## (best-effort) revoked through arc-server's /v1/sys/leases/revoke.
## ---------------------------------------------------------------------------
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: arcdynamiccredentials.arc.io
spec:
  group: arc.io
  scope: Namespaced
  names:
    kind: ArcDynamicCredential
    listKind: ArcDynamicCredentialList
    singular: arcdynamiccredential
    plural: arcdynamiccredentials
    shortNames: [adc]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [source, target]
              properties:
                source:
                  type: object
                  required: [mount, role]
                  properties:
                    mount:
                      type: string
                      description: Plugin mount, e.g. "aws", "github-app".
                    role:
                      type: string
                    ttlSeconds:
                      type: integer
                      description: Optional TTL hint; plugins clamp to their own max.
                target:
                  type: object
                  required: [name]
                  properties:
                    name: { type: string }
                    type: { type: string, default: "Opaque" }
                    template:
                      type: object
                      additionalProperties: { type: string }
                refreshLeadSeconds:
                  type: integer
                  default: 60
                  description: |
                    How many seconds before the lease expires to re-issue. Default 60s.
                    Set generously for credentials that take time to propagate (IAM).
            status:
              type: object
              properties:
                leaseId: { type: string }
                expiresAt: { type: string }
                lastIssueTime: { type: string }
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type: { type: string }
                      status: { type: string }
                      reason: { type: string }
                      message: { type: string }
                      lastTransitionTime: { type: string }
      additionalPrinterColumns:
        - { name: "Mount", type: string, jsonPath: ".spec.source.mount" }
        - { name: "Role", type: string, jsonPath: ".spec.source.role" }
        - { name: "ExpiresAt", type: string, jsonPath: ".status.expiresAt" }
        - { name: "Age", type: date, jsonPath: ".metadata.creationTimestamp" }
      subresources:
        status: {}
