<?xml version="1.0" encoding="UTF-8"?>
<!--
  Maskable variant — the OS crops the outer 10% off (Android adaptive icon
  safe-zone spec). Same mark shrunk to fit a 80% inner square so a circular
  or rounded-rect mask never clips the brand. Background extends to the
  edges so the crop never reveals a white halo.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5b21b6"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Safe-zone group scaled to 80%; mark coordinates kept identical to the
       standard icon so a single render path produces both files. -->
  <g transform="translate(51.2 51.2) scale(0.8)">
    <path
      d="M 168 232
         L 168 176
         a 88 88 0 0 1 176 0
         L 344 232"
      fill="none"
      stroke="#ffffff"
      stroke-width="36"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <rect x="120" y="232" width="272" height="200" rx="36" ry="36" fill="#ffffff"/>
    <text
      x="256" y="356"
      text-anchor="middle"
      font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
      font-size="156"
      font-weight="700"
      fill="#3b0764"
    >a</text>
  </g>
</svg>
