[package]
name = "arc-agent"
version = "0.0.0"
edition = "2021"
publish = false
description = "Workload sidecar for arc. Auto-authenticates with arc-server, fetches secrets, renders templated files, and refreshes dynamic credentials before lease expiry."

[lib]
path = "src/lib.rs"

[[bin]]
name = "arc-agent"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "fs", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tera = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
zeroize = "1"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
