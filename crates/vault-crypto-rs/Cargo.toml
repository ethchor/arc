[package]
name = "arc-vault-crypto"
version = "0.0.0"
edition = "2021"
publish = false
description = "Rust core of the arc-vault zero-knowledge crypto protocol; byte-compatible with @arc/crypto."

[dependencies]
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
ed25519-dalek = "2"
hkdf = "0.12"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"

[dev-dependencies]
hex = "0.4"
