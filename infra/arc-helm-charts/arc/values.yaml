# =============================================================================
# arc Helm values — every knob, with the boring production-safe default first.
#
# The chart deploys two main things:
#   1. arc-server (Deployment) — the Node/Nest API at /vaults, /vault/*, /v1/*, /metrics.
#   2. OpenBao (StatefulSet)   — Engine-A backend. Co-locate by default; toggle off
#                                  when you operate OpenBao separately.
# =============================================================================

# Common defaults applied to everything the chart renders.
nameOverride: ""
fullnameOverride: ""
commonLabels: {}
commonAnnotations: {}
imagePullSecrets: []

# ---------------------------------------------------------------------------
# arc-server
# ---------------------------------------------------------------------------
arcServer:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/ethchor/arc-server
    # Pinned tag. Use `appVersion` from Chart.yaml when bumping in lockstep.
    tag: ""
    pullPolicy: IfNotPresent
  # `NODE_ENV=production` flips arc-server into the strict profile (migrations only,
  # no synchronize). The Deployment also refuses to start when DATABASE_URL is unset.
  env:
    NODE_ENV: production
    LOG_LEVEL: info
    PORT: "3001"
    # Set this to opt into ACL enforcement. Leaves dev defaults if unset.
    ARC_DEFAULT_POLICY: deny
    # Comma list of bootstrap sudo subject ids. Required if ARC_DEFAULT_POLICY=deny.
    ARC_ROOT_USERS: ""
    ARC_POLICY_CACHE_TTL_MS: "30000"
    # OTel: leave empty to disable tracing, otherwise an OTLP/HTTP collector URL.
    OTEL_EXPORTER_OTLP_ENDPOINT: ""
    OTEL_SERVICE_NAME: arc-server
  # Secrets the chart will create (and the Deployment will mount). When `existingSecret`
  # is set we instead reference that, so users can manage secrets out-of-band.
  secret:
    create: true
    existingSecret: ""
    # REQUIRED when create=true — the chart's `required` guard refuses to render the Secret
    # if this is empty (MED-B from the supply-chain audit). Production deployments must
    # overlay via `--set-string arcServer.secret.jwtSecret=$(openssl rand -hex 32)` or wire
    # external-secrets / SealedSecrets and switch to `create=false` + `existingSecret`.
    # Committed values are NOT recommended.
    jwtSecret: ""
    # Connection URL the server reads as DATABASE_URL.
    databaseUrl: ""
    # When OpenBao is co-located by this chart, the StatefulSet's root token is
    # auto-injected. If you point at an external OpenBao, set this.
    baoToken: ""

  service:
    type: ClusterIP
    port: 3001

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 1Gi

  # Pod-level security context (NestJS is fine as non-root).
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]

  livenessProbe:
    httpGet:
      path: /metrics
      port: http
    initialDelaySeconds: 30
    periodSeconds: 30
  readinessProbe:
    httpGet:
      path: /metrics
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10

  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ---------------------------------------------------------------------------
# Postgres dependency (arc-server's primary DB).
# This chart does NOT install Postgres — production deployments use a managed offering
# (RDS / CloudSQL / AlloyDB / hosted). Wire it via `arcServer.secret.databaseUrl`.
# For local clusters, point at a Bitnami postgres chart in the same namespace.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# OpenBao (Engine-A backend)
#
# Co-located by default. Disable when you operate OpenBao separately (e.g. multi-tenant
# OpenBao cluster shared across arc deployments).
# ---------------------------------------------------------------------------
openbao:
  enabled: true
  image:
    repository: quay.io/openbao/openbao
    # Pinned, never `latest` — a mutable base tag lets a re-pull swap the Engine-A binary
    # out from under a pinned arc-server. Bump deliberately to a version you've tested;
    # for the strongest assurance pin by digest (`repository@sha256:...`) and clear `tag`.
    tag: "2.3.1"
    pullPolicy: IfNotPresent
  # Dev mode runs OpenBao in-memory (every secret is LOST on restart) and auto-unseals with
  # a well-known root token — it is **off by default**. The chart refuses to render a
  # dev-mode OpenBao alongside a production arc-server (see openbao-statefulset.yaml's
  # guard): `helm install` defaults give you a non-dev Engine-A you wire a real seal +
  # storage config into. For a LOCAL trial set BOTH `openbao.devMode=true` AND
  # `arcServer.env.NODE_ENV=development`.
  devMode: false
  # Only consulted when devMode=true (local trials). Never a production credential.
  devRootToken: root
  service:
    type: ClusterIP
    port: 8200
  persistence:
    enabled: false
    storageClass: ""
    size: 8Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 1,    memory: 1Gi }

# ---------------------------------------------------------------------------
# Ingress (front the /vaults, /v1, /metrics paths).
# ---------------------------------------------------------------------------
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: arc.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# ---------------------------------------------------------------------------
# Prometheus integration. ServiceMonitor wires the /metrics endpoint we shipped.
# Requires kube-prometheus-stack (or the upstream prometheus-operator) installed.
# ---------------------------------------------------------------------------
serviceMonitor:
  enabled: false
  namespace: ""
  interval: 30s
  scrapeTimeout: 10s
  labels: {}
  # Drop very high-cardinality labels at the relabel layer if needed.
  metricRelabelings: []

# ---------------------------------------------------------------------------
# arc-mcp-server — Engine-A exposed over the Model Context Protocol for AI agents.
# Stateless HTTP service; forwards each agent's bearer to arc-server, where @arc/grants
# gates the call. Agents authenticate via the OIDC / Kubernetes auth methods to get a
# policy-bound arc JWT, then connect here with it as the bearer. No cluster RBAC needed
# (it talks to arc-server over HTTP, not the kube API).
# ---------------------------------------------------------------------------
mcpServer:
  enabled: false
  replicaCount: 1
  image:
    repository: ghcr.io/ethchor/arc-mcp-server
    tag: ""
    pullPolicy: IfNotPresent
  # Base URL the MCP server uses to reach arc-server. Empty = the in-chart server Service.
  arcServerUrl: ""
  service:
    type: ClusterIP
    port: 8800
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    fsGroup: 10001
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ---------------------------------------------------------------------------
# arc-operator — Kubernetes operator reconciling ArcSecret + ArcDynamicCredential CRDs
# into K8s Secrets. Needs real cluster RBAC (watch the CRDs, write Secrets everywhere) and
# authenticates to arc-server with its own ServiceAccount token via the Kubernetes auth
# method. The CRDs themselves ship in the chart's `crds/` directory (Helm installs them).
# ---------------------------------------------------------------------------
operator:
  enabled: false
  replicaCount: 1
  image:
    repository: ghcr.io/ethchor/arc-operator
    tag: ""
    pullPolicy: IfNotPresent
  # Base URL the operator uses to reach arc-server. Empty = the in-chart server Service.
  arcServerUrl: ""
  # Auth method + role the operator logs into. The role must be configured on arc-server's
  # `kubernetes` auth mount and bound to the policies the operator's secrets require.
  auth:
    mount: kubernetes
    role: arc-operator
  pollIntervalSeconds: 30
  serviceAccount:
    create: true
    # Leave empty to use the generated name. Annotate for IRSA / Workload Identity if the
    # operator also needs cloud IAM (it usually doesn't — arc brokers that).
    name: ""
    annotations: {}
  rbac:
    create: true
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    fsGroup: 10001
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ---------------------------------------------------------------------------
# arc-agent — the workload sidecar runs INSIDE your application pods (init container +
# sidecar), not as its own Deployment, so the chart can't "deploy" it. What it ships is an
# optional sample config ConfigMap + the sidecar snippet (see the chart README / NOTES).
# The agent needs no cluster RBAC — it talks to arc-server over HTTP and authenticates with
# the workload pod's own ServiceAccount token.
# ---------------------------------------------------------------------------
agent:
  image:
    repository: ghcr.io/ethchor/arc-agent
    tag: ""
  auth:
    mount: kubernetes
    role: arc-agent
  # Ship a starter /etc/arc-agent/config.yaml as a ConfigMap you can reference from your
  # workload's volume. Off by default; turn on for a demo or to copy-and-edit.
  sampleConfig:
    enabled: false
