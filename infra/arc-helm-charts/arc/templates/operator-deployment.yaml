{{- if .Values.operator.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "arc.operator.fullname" . }}
  labels:
    {{- include "arc.labels" . | nindent 4 }}
    app.kubernetes.io/component: arc-operator
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  # Single replica — the reconcile loop is not leader-elected yet, so running two would
  # double the work (and the audit). Keep at 1.
  replicas: 1
  selector:
    matchLabels:
      {{- include "arc.operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "arc.operator.selectorLabels" . | nindent 8 }}
      {{- with .Values.operator.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "arc.operator.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.operator.podSecurityContext | nindent 8 }}
      containers:
        - name: arc-operator
          image: "{{ .Values.operator.image.repository }}:{{ default .Chart.AppVersion .Values.operator.image.tag }}"
          imagePullPolicy: {{ .Values.operator.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.operator.containerSecurityContext | nindent 12 }}
          env:
            - name: ARC_SERVER_URL
              value: {{ default (include "arc.server.internalUrl" .) .Values.operator.arcServerUrl | quote }}
            - name: ARC_AUTH_MOUNT
              value: {{ .Values.operator.auth.mount | quote }}
            - name: ARC_AUTH_ROLE
              value: {{ .Values.operator.auth.role | quote }}
            - name: POLL_INTERVAL_SECONDS
              value: {{ .Values.operator.pollIntervalSeconds | quote }}
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
      {{- with .Values.operator.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
