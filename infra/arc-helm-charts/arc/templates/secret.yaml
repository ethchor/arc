{{- if and .Values.arcServer.enabled .Values.arcServer.secret.create -}}
{{/*
  MED-B (supply-chain audit): `arcServer.secret.jwtSecret` MUST be set when this chart
  creates the Secret. Previously the default `""` silently rendered a Secret missing the
  JWT_SECRET key — arc-server's `jwt.constants.ts:11` throws in production, so the pod
  CrashLoops with a misleading "JWT_SECRET is required in production" error and the
  operator has to read pod logs to figure out the chart was the cause. `required` makes
  the failure happen at `helm install/upgrade` time with a clear message pointing at the
  knob to set. Operators who manage the Secret out-of-band (external-secrets, SealedSecrets,
  CSI driver) still have the supported path: `secret.create=false` + `secret.existingSecret`
  — that's evaluated above this template and skips us entirely.
*/}}
{{- $jwtSecret := required (printf "%s\n%s\n%s"
  "arcServer.secret.jwtSecret is required when arcServer.secret.create=true."
  "Set --set-string arcServer.secret.jwtSecret=$(openssl rand -hex 32) (or supply via external-secrets / SealedSecrets)."
  "Alternatively set arcServer.secret.create=false and arcServer.secret.existingSecret=<name>.")
  .Values.arcServer.secret.jwtSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "arc.server.secretName" . }}
  labels:
    {{- include "arc.labels" . | nindent 4 }}
    app.kubernetes.io/component: arc-server
type: Opaque
# Server boot-time requirements. Production deployments overlay these via
# `--set-string` from CI / external-secrets / SealedSecrets — never commit live values.
stringData:
  JWT_SECRET: {{ $jwtSecret | quote }}
  {{- with .Values.arcServer.secret.databaseUrl }}
  DATABASE_URL: {{ . | quote }}
  {{- end }}
  {{- if .Values.openbao.enabled }}
  # When OpenBao is co-located the StatefulSet exposes the dev root token at a known
  # address; the server picks it up from `BAO_TOKEN` below in the Deployment env.
  BAO_TOKEN: {{ .Values.openbao.devRootToken | quote }}
  {{- else if .Values.arcServer.secret.baoToken }}
  BAO_TOKEN: {{ .Values.arcServer.secret.baoToken | quote }}
  {{- end }}
{{- end }}
