{{- if and .Values.arcServer.enabled .Values.arcServer.secret.create -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "arc.server.secretName" . }}
  labels:
    {{- include "arc.labels" . | nindent 4 }}
    app.kubernetes.io/component: arc-server
type: Opaque
# Server boot-time requirements. Production deployments overlay these via
# `--set-string` from CI / external-secrets / SealedSecrets — never commit live values.
stringData:
  {{- with .Values.arcServer.secret.jwtSecret }}
  JWT_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.arcServer.secret.databaseUrl }}
  DATABASE_URL: {{ . | quote }}
  {{- end }}
  {{- if .Values.openbao.enabled }}
  # When OpenBao is co-located the StatefulSet exposes the dev root token at a known
  # address; the server picks it up from `BAO_TOKEN` below in the Deployment env.
  BAO_TOKEN: {{ .Values.openbao.devRootToken | quote }}
  {{- else if .Values.arcServer.secret.baoToken }}
  BAO_TOKEN: {{ .Values.arcServer.secret.baoToken | quote }}
  {{- end }}
{{- end }}
