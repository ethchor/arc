{{- if .Values.openbao.enabled -}}
{{- /*
  HIGH-B production-safety guard (untrusted-code audit). Dev-mode OpenBao is in-memory
  (every secret lost on restart) and auto-unseals with a well-known root token; running
  it under a production arc-server is a silent, total Engine-A compromise. Make that
  combination un-renderable rather than insecure-by-accident. A local trial opts into
  BOTH dev-mode OpenBao and a development arc-server together.
*/ -}}
{{- if and .Values.openbao.devMode (eq (default "" .Values.arcServer.env.NODE_ENV) "production") }}
{{- fail "openbao.devMode=true is unsafe with arcServer.env.NODE_ENV=production: dev-mode OpenBao runs in-memory (all secrets lost on restart) and uses a well-known root token. Set openbao.devMode=false and wire a real seal + storage config, or set arcServer.env.NODE_ENV=development for a local trial." }}
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "arc.openbao.fullname" . }}
  labels:
    {{- include "arc.labels" . | nindent 4 }}
    app.kubernetes.io/component: openbao
spec:
  serviceName: {{ include "arc.openbao.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "arc.openbao.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "arc.openbao.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: openbao
          image: "{{ .Values.openbao.image.repository }}:{{ .Values.openbao.image.tag }}"
          imagePullPolicy: {{ .Values.openbao.image.pullPolicy }}
          {{- if .Values.openbao.devMode }}
          # `server -dev` auto-initializes + auto-unseals with `BAO_DEV_ROOT_TOKEN_ID` as the
          # bootstrap token. NEVER use this in production — the server starts in-memory and
          # loses every secret on restart.
          args: ["server", "-dev"]
          env:
            - name: BAO_DEV_ROOT_TOKEN_ID
              value: {{ .Values.openbao.devRootToken | quote }}
            - name: BAO_DEV_LISTEN_ADDRESS
              value: "0.0.0.0:{{ .Values.openbao.service.port }}"
          {{- else }}
          # Production posture: config.hcl comes from openbao-configmap.yaml (Raft storage
          # on the PVC + listener + seal). That template refuses to render without
          # persistence, so this branch can no longer start an in-memory "production" vault.
          args: ["server", "-config=/etc/openbao/config.hcl"]
          {{- if eq .Values.openbao.seal.type "transit" }}
          env:
            # Kept out of the ConfigMap — a seal token in a ConfigMap is readable by anyone
            # with namespace get access.
            - name: BAO_SEAL_TRANSIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.openbao.seal.transit.tokenSecret.name | quote }}
                  key: {{ .Values.openbao.seal.transit.tokenSecret.key | quote }}
          {{- end }}
          {{- end }}
          ports:
            - name: api
              containerPort: {{ .Values.openbao.service.port }}
              protocol: TCP
          volumeMounts:
            {{- if .Values.openbao.persistence.enabled }}
            - name: data
              mountPath: /openbao/data
            {{- end }}
            {{- if not .Values.openbao.devMode }}
            - name: config
              mountPath: /etc/openbao
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.openbao.resources | nindent 12 }}
      {{- if not .Values.openbao.devMode }}
      volumes:
        - name: config
          configMap:
            name: {{ include "arc.openbao.fullname" . }}-config
      {{- end }}
  {{- if .Values.openbao.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.openbao.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.openbao.persistence.size }}
  {{- end }}
{{- end }}
