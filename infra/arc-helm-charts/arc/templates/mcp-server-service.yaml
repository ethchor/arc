{{- if .Values.mcpServer.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "arc.mcp.fullname" . }}
  labels:
    {{- include "arc.labels" . | nindent 4 }}
    app.kubernetes.io/component: arc-mcp-server
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.mcpServer.service.type }}
  selector:
    {{- include "arc.mcp.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.mcpServer.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
