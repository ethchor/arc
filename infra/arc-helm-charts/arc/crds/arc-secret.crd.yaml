## ---------------------------------------------------------------------------
## ArcSecret — declarative sync of an arc KV v2 secret into a Kubernetes Secret.
##
## The operator polls each ArcSecret, fetches its `source` from arc-server via the
## /v1/<mount>/data/<path> route, applies the (optional) Go-template, and writes the
## resulting key/value map into the target Secret. `status` records the last sync.
## ---------------------------------------------------------------------------
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: arcsecrets.arc.io
spec:
  group: arc.io
  scope: Namespaced
  names:
    kind: ArcSecret
    listKind: ArcSecretList
    singular: arcsecret
    plural: arcsecrets
    shortNames: [as]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [source, target]
              properties:
                source:
                  type: object
                  required: [path]
                  properties:
                    mount:
                      type: string
                      description: KV v2 mount on arc-server. Defaults to "secret".
                      default: "secret"
                    path:
                      type: string
                      description: Path within the mount, e.g. "app/prod/db".
                    version:
                      type: integer
                      minimum: 1
                      description: Optional specific KV version to read.
                target:
                  type: object
                  required: [name]
                  properties:
                    name:
                      type: string
                      description: Name of the K8s Secret to write into the same namespace.
                    type:
                      type: string
                      default: "Opaque"
                    template:
                      type: object
                      additionalProperties:
                        type: string
                      description: |
                        Optional map of Secret-key → template. {{ .field }} substitutes the
                        named field from the arc secret. Omit to copy fields verbatim.
                refreshIntervalSeconds:
                  type: integer
                  default: 300
                  minimum: 5
            status:
              type: object
              properties:
                lastSyncTime: { type: string }
                observedVersion: { type: integer }
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type: { type: string }
                      status: { type: string }
                      reason: { type: string }
                      message: { type: string }
                      lastTransitionTime: { type: string }
      additionalPrinterColumns:
        - { name: "Path", type: string, jsonPath: ".spec.source.path" }
        - { name: "Target", type: string, jsonPath: ".spec.target.name" }
        - { name: "LastSync", type: string, jsonPath: ".status.lastSyncTime" }
        - { name: "Age", type: date, jsonPath: ".metadata.creationTimestamp" }
      subresources:
        status: {}
