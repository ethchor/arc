name: Release plugin — arc-plugin-aws

# Builds, signs, and publishes the OOP `arc-plugin-aws` binary + its signed manifest as a
# GitHub Release asset (ADR-005 Phase 5b). Trigger a release by pushing a tag of the
# shape `plugin-aws-vX.Y.Z`; `workflow_dispatch` allows a manual re-run.
#
# Two layers of signing are applied:
#
#  1. **Manifest signing (Ed25519)** — `arc-plugin-sign sign` produces the
#     `manifest.json` arc-server's `PluginManifestService` verifies. Requires the
#     `ARC_PUBLISHER_PRIV` repo secret. This is the *runtime trust input* — operators pin
#     the matching pub in `ARC_PLUGIN_TRUST_ANCHORS`. When the secret is unset the
#     workflow still runs end-to-end with a workflow-local test key (publish step
#     skipped), so a PR exercises the path before real keys rotate.
#
#  2. **cosign keyless (sigstore)** — `cosign sign-blob` signs each release artifact
#     (`bin.cjs`, `manifest.json`, `SHA256SUMS`) with this workflow's OIDC identity. The
#     signature + the Fulcio-issued cert chain + the Rekor transparency-log entry are
#     bundled into a `.bundle` file per artifact, attached to the GitHub release. No
#     long-lived keys; the cert is short-lived (~10 minutes) and the binding is to this
#     exact workflow file at this exact commit. Operators verify by running
#     `cosign verify-blob --bundle <bundle> --certificate-identity-regexp …
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com <artifact>`.
#
#  The two layers are complementary: manifest signing binds the artifact to a *publisher
#  identity* operators chose to trust; cosign binds it to a *transparently-logged build*
#  on a known workflow. Either alone gets caught by tamper; together you get tamper
#  evidence + identity provenance + public-internet audit trail.
on:
  push:
    tags:
      - "plugin-aws-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to build, e.g. plugin-aws-v0.1.0 (defaults to triggering ref)."
        required: false

permissions:
  contents: write # create release + upload assets
  id-token: write # cosign keyless signing via the GitHub OIDC token

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release:
    # Explicit safety: only run when the ref is one of our release tags or a
    # workflow_dispatch invocation. The `on:` filter above should already do this, but
    # GitHub has historically been quirky with `push.tags`-only workflows showing up as
    # "failed" runs on branch pushes when the YAML pre-validates. The `if:` guarantees
    # the job is skipped (not failed) for any non-release ref.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/plugin-aws-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Resolve version
        id: v
        run: |
          ref="${{ github.event.inputs.tag || github.ref_name }}"
          if [[ "$ref" != plugin-aws-v* ]]; then
            echo "::error::tag $ref doesn't match plugin-aws-v* — refusing to release"
            exit 1
          fi
          version="${ref#plugin-aws-v}"
          echo "tag=$ref" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing arc-plugin-aws@$version (tag $ref)"

      - run: pnpm install --frozen-lockfile

      # The signing CLI lives in tools/arc-plugin-sign; build it once for `node dist/bin.js`.
      - name: Build @arc/plugin-sign (signing CLI)
        run: pnpm --filter @arc/plugin-sign build

      - name: Build @arc/plugin-aws (OOP bin)
        run: pnpm --filter @arc/plugin-aws build

      - name: Stamp the version into the plugin's manifest claim
        id: stamp
        run: |
          v="${{ steps.v.outputs.version }}"
          # tsup emits dist/bin.cjs from src/bin.ts; the artifact bytes are the
          # release artifact. Sanity-check it exists + is executable.
          test -x plugins/cloud/arc-plugin-aws/dist/bin.cjs
          echo "artifact=plugins/cloud/arc-plugin-aws/dist/bin.cjs" >> "$GITHUB_OUTPUT"
          echo "manifest=plugins/cloud/arc-plugin-aws/dist/manifest.json" >> "$GITHUB_OUTPUT"
          # Pre-compute the artifact's SHA-256 for the release notes (informational; the
          # signed manifest is the authoritative pin).
          sha=$(sha256sum plugins/cloud/arc-plugin-aws/dist/bin.cjs | awk '{print $1}')
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"

      - name: Sign the manifest
        id: sign
        env:
          ARC_PUBLISHER_PRIV: ${{ secrets.ARC_PUBLISHER_PRIV }}
        run: |
          # Capability declaration mirrors the AWS plugin's actual runtime surface:
          #   creds/<role> issue ⇒ read (Vault's policy mapping for dynamic creds)
          #   lease revoke      ⇒ delete (the only revoke path; renew is a no-op for STS)
          # No `update` because STS-issued creds are non-renewable (the plugin throws
          # `not_renewable` upstream). Encoding that in the manifest keeps the server's
          # gate honest: if a caller ever asks to renew, the gate refuses with a clear
          # `plugin_capability_not_declared`, *before* it reaches the plugin's NRE error.
          if [ -z "${ARC_PUBLISHER_PRIV:-}" ]; then
            echo "::warning::ARC_PUBLISHER_PRIV not set — signing with a workflow-local test key."
            echo "::warning::The resulting manifest is NOT publishable. Set the secret to release for real."
            # Generate a throwaway key just so the build path still validates end-to-end.
            node tools/arc-plugin-sign/dist/bin.js keygen --out-priv .release-key
            ARC_PUBLISHER_PRIV=$(cat .release-key)
            echo "test_key_used=true" >> "$GITHUB_OUTPUT"
          else
            echo "test_key_used=false" >> "$GITHUB_OUTPUT"
          fi
          export ARC_PUBLISHER_PRIV
          node tools/arc-plugin-sign/dist/bin.js sign \
            --artifact "${{ steps.stamp.outputs.artifact }}" \
            --priv env:ARC_PUBLISHER_PRIV \
            --publisher "publisher:arc-core" \
            --name "arc-plugin-aws" \
            --version "${{ steps.v.outputs.version }}" \
            --kind process \
            --capabilities "read,delete" \
            --out "${{ steps.stamp.outputs.manifest }}"
          # Re-derive the matching pub from the priv so the next step can self-verify
          # without a second secret round-trip. The pub is public anyway — it's what
          # operators will pin in ARC_PLUGIN_TRUST_ANCHORS.
          pub=$(node tools/arc-plugin-sign/dist/bin.js pubkey --priv env:ARC_PUBLISHER_PRIV)
          echo "pub_b64u=$pub" >> "$GITHUB_OUTPUT"
          # Always shred the priv from disk if we wrote a workflow-local one.
          rm -f .release-key

      - name: Self-verify (sanity: would arc-server accept this manifest?)
        run: |
          node tools/arc-plugin-sign/dist/bin.js verify \
            --artifact "${{ steps.stamp.outputs.artifact }}" \
            --manifest "${{ steps.stamp.outputs.manifest }}" \
            --pub "${{ steps.sign.outputs.pub_b64u }}"

      - name: Bundle the release tarball (bin.cjs + manifest.json + SHA256SUMS)
        id: bundle
        run: |
          dir="release-arc-plugin-aws-${{ steps.v.outputs.version }}"
          mkdir -p "$dir"
          cp "${{ steps.stamp.outputs.artifact }}" "$dir/bin.cjs"
          cp "${{ steps.stamp.outputs.manifest }}" "$dir/manifest.json"
          ( cd "$dir" && sha256sum bin.cjs manifest.json > SHA256SUMS )
          tar -czf "$dir.tar.gz" "$dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "tarball=$dir.tar.gz" >> "$GITHUB_OUTPUT"
          echo "bin=$dir/bin.cjs" >> "$GITHUB_OUTPUT"
          echo "manifest=$dir/manifest.json" >> "$GITHUB_OUTPUT"
          echo "sums=$dir/SHA256SUMS" >> "$GITHUB_OUTPUT"

      # cosign keyless signing — second trust layer, complementary to the manifest
      # signing above. Skipped when ARC_PUBLISHER_PRIV was unset (`test_key_used == true`)
      # since there's no release artifact to attach signatures to anyway.
      - name: Install cosign
        if: ${{ steps.sign.outputs.test_key_used == 'false' }}
        uses: sigstore/cosign-installer@v3

      - name: cosign sign release artifacts (keyless, OIDC-bound, Rekor-logged)
        id: cosign
        if: ${{ steps.sign.outputs.test_key_used == 'false' }}
        run: |
          dir="${{ steps.bundle.outputs.dir }}"
          # `sign-blob --yes` skips the interactive Fulcio prompt; `--bundle` writes a
          # single self-contained sigstore bundle (cert chain + signature + Rekor entry)
          # that operators verify with one `cosign verify-blob --bundle <file>` call.
          for f in bin.cjs manifest.json SHA256SUMS; do
            cosign sign-blob --yes --bundle "$dir/$f.bundle" "$dir/$f"
          done
          echo "bin_bundle=$dir/bin.cjs.bundle" >> "$GITHUB_OUTPUT"
          echo "manifest_bundle=$dir/manifest.json.bundle" >> "$GITHUB_OUTPUT"
          echo "sums_bundle=$dir/SHA256SUMS.bundle" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        if: ${{ steps.sign.outputs.test_key_used == 'false' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: arc-plugin-aws ${{ steps.v.outputs.version }}
          body: |
            **arc-plugin-aws ${{ steps.v.outputs.version }}** — out-of-process AWS plugin for arc-server.

            ### Artifacts

            - `bin.cjs` — self-contained OOP plugin binary. Spawned by arc-server's
              `mountRemoteSecretsPlugin` (ADR-005 Phase 5b). The AWS SDK is an external
              peer dep — install `@aws-sdk/client-sts` on the host that runs arc-server.
            - `manifest.json` — signed manifest pinning the binary's SHA-256 + the
              declared capabilities (`read,delete` — see "Capabilities" below). Server
              verifies via `ARC_PLUGIN_TRUST_ANCHORS=publisher:arc-core=<pub>`.
            - `SHA256SUMS` — informational; the signed manifest is the authoritative pin.
            - `bin.cjs.bundle`, `manifest.json.bundle`, `SHA256SUMS.bundle` — sigstore
              bundles (cosign keyless). One per signed artifact. See the "cosign verify"
              section below.

            ### Verify locally before staging

            **Layer 1 — manifest signature (Ed25519 publisher key)**

            ```sh
            tar -xzf release-arc-plugin-aws-${{ steps.v.outputs.version }}.tar.gz
            cd release-arc-plugin-aws-${{ steps.v.outputs.version }}
            node tools/arc-plugin-sign/dist/bin.js verify \
              --artifact bin.cjs \
              --manifest manifest.json \
              --pub <publisher-pub-b64u>
            ```

            **Layer 2 — cosign keyless (sigstore transparency log)**

            ```sh
            for f in bin.cjs manifest.json SHA256SUMS; do
              cosign verify-blob \
                --bundle "$f.bundle" \
                --certificate-identity-regexp '^https://github.com/ethchor/arc/.github/workflows/release-plugin-aws.yml@.*' \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                "$f"
            done
            ```

            Each `verify-blob` checks: the artifact bytes match the signed digest, the
            cosign cert was issued by Fulcio with this exact workflow's OIDC identity,
            and the signature is recorded in the Rekor transparency log. Verification
            requires no pre-shared secret — anyone on the internet can audit a release
            after the fact.

            ### Capabilities

            `read,delete` — STS-issued creds can be issued (`read` on `<mount>/creds/<role>`)
            and revoked locally (`delete` via `sys/leases/revoke`). The plugin does **not**
            declare `update` because STS creds are non-renewable; the gate refuses a renew
            request before it reaches the plugin's `not_renewable` error.

            ### Mount on arc-server

            ```
            ARC_PLUGIN_TRUST_ANCHORS=publisher:arc-core=<pub-b64u>
            ARC_PLUGIN_MOUNTS=aws=/opt/arc/plugins/aws/bin.cjs?manifest=/opt/arc/plugins/aws/manifest.json
            ```

            ### Signed bytes

            - `bin.cjs` SHA-256: `${{ steps.stamp.outputs.sha256 }}`
            - Publisher: `publisher:arc-core`
            - Tag: `${{ steps.v.outputs.tag }}`
            - cosign cert identity: `https://github.com/ethchor/arc/.github/workflows/release-plugin-aws.yml@refs/tags/${{ steps.v.outputs.tag }}`
          files: |
            ${{ steps.bundle.outputs.tarball }}
            ${{ steps.bundle.outputs.bin }}
            ${{ steps.bundle.outputs.manifest }}
            ${{ steps.bundle.outputs.sums }}
            ${{ steps.cosign.outputs.bin_bundle }}
            ${{ steps.cosign.outputs.manifest_bundle }}
            ${{ steps.cosign.outputs.sums_bundle }}

      - name: Summary
        run: |
          {
            echo "### arc-plugin-aws ${{ steps.v.outputs.tag }}"
            echo ""
            echo "- Artifact: \`${{ steps.stamp.outputs.artifact }}\`"
            echo "- SHA-256: \`${{ steps.stamp.outputs.sha256 }}\`"
            echo "- Tarball: \`${{ steps.bundle.outputs.tarball }}\`"
            if [ "${{ steps.sign.outputs.test_key_used }}" = "true" ]; then
              echo ""
              echo "> ⚠️ Signed with a workflow-local test key (\`ARC_PUBLISHER_PRIV\` was unset)."
              echo "> The release was **not** published. cosign step skipped (no artifacts to attach to)."
              echo "> Set the repo secret + re-run to release for real."
            else
              echo "- Manifest signed: Ed25519 publisher key ✓"
              echo "- cosign keyless (sigstore): \`bin.cjs.bundle\`, \`manifest.json.bundle\`, \`SHA256SUMS.bundle\` ✓"
              echo "- Released: see the Releases tab"
              echo ""
              echo "**cosign verify-blob:**"
              echo '```sh'
              echo "cosign verify-blob \\"
              echo "  --bundle bin.cjs.bundle \\"
              echo "  --certificate-identity-regexp 'https://github.com/ethchor/arc/.github/workflows/release-plugin-aws.yml@.*' \\"
              echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
              echo "  bin.cjs"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
