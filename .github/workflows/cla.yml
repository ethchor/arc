# CLA gate (contributor-assistant). On a contributor's first PR the bot comments asking
# them to sign the CLA (CLA.md) by replying with the exact sign phrase; signatures are
# recorded as JSON commits on the dedicated `cla-signatures` branch (never on develop);
# the PR's "CLA" status flips green once every commit author in the PR has signed.
# Commenting `recheck` re-runs the check on demand.
#
# Why `pull_request_target` and not `pull_request`: fork PRs get a read-only GITHUB_TOKEN
# under `pull_request`, and the bot must write a comment + a status + a signature commit.
# This is safe ONLY because the job never checks out or executes PR code — it talks to the
# GitHub API exclusively. Do not add a checkout step to this workflow.
#
# Pinned to v2.6.1 — contributor-assistant does NOT maintain a sliding `v2` major tag, so
# `@v2` would fail to resolve and instant-fail every PR event (the same failure-spam class
# as the workflows-disabled/README.md incident). Verify the tag exists before bumping.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Run the contributor-assistant CLA check
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: "signatures/version1/cla.json"
          path-to-document: "https://github.com/ethchor/arc/blob/develop/CLA.md"
          branch: "cla-signatures"
          allowlist: "ethchor,*[bot]"
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
