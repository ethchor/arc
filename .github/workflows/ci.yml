name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

# Opt every JavaScript-based action into Node.js 24 ahead of GitHub's June 16, 2026 forced
# cutover. Without this, third-party actions still running on Node 20 inside the runner emit
# a deprecation warning on every step. arc is a security platform: we run on **LTS only**
# and stay one major ahead of the runner's forced minimum.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Memory posture + diagnostics for the recurring exit-137 (SIGKILL) on
      # @arc/server#test (2026-06-09/10). The image ships /swapfile already active, so
      # the kills happened DESPITE host swap — suspect: a cgroup memory limit on the job
      # scope (cgroup OOM ignores host swap). This step records the facts; the always()
      # step after the tests prints the kernel's own account of any kill.
      - name: Memory posture (swap + cgroup limits)
        run: |
          free -h
          swapon --show || true
          echo "--- job cgroup memory limits ---"
          CG="/sys/fs/cgroup$(cut -d: -f3 /proc/self/cgroup)"
          echo "cgroup: $CG"
          for f in memory.max memory.swap.max memory.high; do
            [ -f "$CG/$f" ] && echo "$f = $(cat "$CG/$f")" || echo "$f: (absent)"
          done
          # Add 8GB extra swap on the big ephemeral disk — tolerate pre-existing swap.
          sudo fallocate -l 8G /mnt/swapfile2 \
            && sudo chmod 600 /mnt/swapfile2 \
            && sudo mkswap /mnt/swapfile2 \
            && sudo swapon /mnt/swapfile2 \
            || echo "extra swap not added (continuing)"
          free -h
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # MED-H (supply-chain audit): the `@arc/crypto` test suite includes a Rust→TS
      # pqSeal parity check that spawns `cargo run --example gen_pq_vector`. Without
      # cargo on PATH the test skips silently — which exactly recreates the coverage
      # gap MED-H was about. Installing the stable toolchain here keeps the contract
      # exercised on every push (one-time ~15s `cargo build` is amortised across the
      # Argon2id + ML-KEM crypto tests downstream).
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      # Tests run sequentially. turbo's default concurrency (10) piles every package's
      # test suite on top of @arc/server's jest run (which boots multiple Nest apps +
      # sql.js wasm) — on the 2-core/7GB hosted runner that intermittently trips the
      # OOM killer (exit 137) or starves sibling vitest processes into transient fs
      # errors. Three red `node` runs on 2026-06-09/10 traced back to this. Build and
      # typecheck stay parallel; they've never approached the ceiling.
      #
      # NB: invoke turbo directly. `pnpm test -- --concurrency=1` does NOT work — pnpm
      # v7+ forwards the `--` literally, so turbo sees `run test -- --concurrency=1`
      # and passes the flag down to every package's vitest (which errors on it) instead
      # of consuming it as its own scheduling flag.
      - run: pnpm exec turbo run test --concurrency=1
      # If anything got OOM-killed, the kernel log names the killer (host OOM vs
      # "Memory cgroup out of memory") and the victim's RSS — runs even when tests fail.
      - name: Kernel OOM forensics
        if: always()
        run: sudo dmesg | grep -iE "out of memory|oom|killed process" | tail -20 || echo "no OOM events in dmesg"
      # MED-I (supply-chain audit): critical-severity advisories now block CI.
      # `pnpm audit --audit-level=critical` exits non-zero only when a critical-tier
      # advisory hits the lockfile — high/moderate stay warnings so transient registry
      # blips or "high" advisories without a confirmed fix-path don't paper-cut every
      # PR. The follow-up "high warning" step is informational only.
      - name: Dependency audit (CRITICAL — blocking)
        run: pnpm audit --audit-level=critical
      - name: Dependency audit (high — informational)
        run: pnpm audit --audit-level=high
        continue-on-error: true

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: arc-go-sdk build + vet + test
        working-directory: sdks/arc-go-sdk
        run: |
          go build ./...
          go vet ./...
          go test ./...

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust crypto parity tests
        run: cargo test --manifest-path crates/vault-crypto-rs/Cargo.toml
      - name: Desktop-core tests
        run: cargo test --manifest-path crates/desktop-core/Cargo.toml
      - name: arc-agent tests
        run: cargo test --manifest-path crates/arc-agent/Cargo.toml
      # MED-I (supply-chain audit): symmetric with the node side — `cargo audit` runs in
      # default mode (which exits non-zero on any advisory) so an unfixed crypto CVE in a
      # crate we depend on (e.g. an ed25519-dalek bump) blocks merge. The install step is
      # best-effort tolerant because cargo-install can fail on transient registry; if the
      # binary isn't there the audit step skips (so install hiccups don't false-block CI).
      - name: cargo audit (blocking when binary present)
        run: |
          cargo install cargo-audit --locked || true
          if command -v cargo-audit >/dev/null 2>&1; then
            cargo audit --file crates/vault-crypto-rs/Cargo.lock
          else
            echo "::warning::cargo-audit binary unavailable — audit skipped this run"
          fi

  # Smoke-tests the OpenBao adapter against a real OpenBao instance. The Node smoke
  # suite already skips when BAO_ADDR is unset, so we only need to give it one.
  openbao-adapter:
    runs-on: ubuntu-latest
    services:
      openbao:
        # MED-I (supply-chain audit): pin to a concrete tag, never the mutable `latest` —
        # matches `infra/arc-helm-charts/arc/values.yaml::openbao.image.tag`. A re-pulled
        # `latest` between merge and a release could swap the integration-tested binary
        # out from under us; the helm chart already tests this version, the adapter
        # smoke job should run against the same one.
        image: quay.io/openbao/openbao:2.3.1
        # Match `integrations/arc-openbao-adapter/docker-compose.yml`.
        env:
          BAO_DEV_ROOT_TOKEN_ID: root
          BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
        ports:
          - 8200:8200
        options: >-
          --cap-add=IPC_LOCK
          --health-cmd="wget -q -O- http://127.0.0.1:8200/v1/sys/health || exit 1"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      BAO_ADDR: http://127.0.0.1:8200
      BAO_TOKEN: root
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build adapter + deps
        run: pnpm --filter @arc/openbao-adapter... build
      - name: Live integration test against dev-mode OpenBao
        run: pnpm --filter @arc/openbao-adapter test

  # Validates the Helm chart with the real `helm` binary on top of the structural
  # vitest suite that already runs in the `node` job. Catches anything that breaks
  # Go-template rendering (missing partials, bad indentation, sprig-fn typos).
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: helm lint
        run: helm lint infra/arc-helm-charts/arc
      # MED-B (supply-chain audit): the chart now `required`s arcServer.secret.jwtSecret
      # when create=true. A bare-defaults render is intentionally a render-time failure;
      # this step asserts the failure happens at chart layer (clear message), not at pod
      # CrashLoop time. Greps for the chart's error wording so a regression that drops the
      # guard breaks CI loudly.
      - name: helm refuses to render without arcServer.secret.jwtSecret (MED-B regression)
        run: |
          set +e
          out="$(helm template arc infra/arc-helm-charts/arc 2>&1)"
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "::error::Chart rendered with empty arcServer.secret.jwtSecret; MED-B guard regressed."
            exit 1
          fi
          echo "$out" | grep -q "arcServer.secret.jwtSecret is required" || {
            echo "::error::Chart failed for an unexpected reason — guard wording changed?"
            echo "$out"
            exit 1
          }
          echo "MED-B guard fired as expected: $(echo "$out" | head -1)"
      - name: helm template (default values, jwt secret supplied)
        run: |
          helm template arc infra/arc-helm-charts/arc \
            --set arcServer.secret.jwtSecret=ci-default-test-jwt \
            > /tmp/arc-default.yaml
      - name: helm template (production-ish overrides)
        run: |
          helm template arc infra/arc-helm-charts/arc \
            --set arcServer.secret.jwtSecret=test-jwt \
            --set arcServer.secret.databaseUrl=postgres://test \
            --set arcServer.env.OTEL_EXPORTER_OTLP_ENDPOINT=http://otel:4318 \
            --set openbao.devMode=false \
            --set openbao.persistence.enabled=true \
            --set ingress.enabled=true \
            --set serviceMonitor.enabled=true \
            > /tmp/arc-prod.yaml
      - name: Sanity-check rendered manifests parse as YAML
        run: |
          python3 - <<'PY'
          import sys, yaml
          for path in ("/tmp/arc-default.yaml", "/tmp/arc-prod.yaml"):
              docs = list(yaml.safe_load_all(open(path)))
              docs = [d for d in docs if d]
              assert docs, f"{path} produced no documents"
              kinds = sorted({d.get("kind") for d in docs})
              print(path, "→", kinds)
          PY

  # Validates the Terraform module formatting + syntax. The structural vitest
  # suite from the `node` job catches drift between the module and the chart;
  # this job catches HCL/typing bugs the parser can't see.
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: terraform fmt
        run: terraform fmt -check -recursive infra/arc-terraform
      - name: terraform init (module dir)
        working-directory: infra/arc-terraform/modules/arc
        run: terraform init -backend=false -input=false
      - name: terraform validate (module dir)
        working-directory: infra/arc-terraform/modules/arc
        run: terraform validate -no-color
      - name: terraform init (dev example)
        working-directory: infra/arc-terraform/examples/dev
        run: terraform init -backend=false -input=false
      - name: terraform validate (dev example)
        working-directory: infra/arc-terraform/examples/dev
        run: terraform validate -no-color

  # Builds the arc-server image on every PR (no push) so the Dockerfile that `release.yml`
  # publishes never rots, and boots it to prove the deployed bundle actually serves /metrics.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build arc-server image (load locally, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/arc-server/Dockerfile
          push: false
          load: true
          tags: arc-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the image boots and serves /metrics
        run: |
          # NODE_ENV=development uses the in-memory sql.js fallback (production refuses to
          # boot without DATABASE_URL), so the image can come up with no external deps.
          id=$(docker run -d -e NODE_ENV=development -e PORT=3001 -p 3001:3001 arc-server:ci)
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/metrics >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          echo "----- container logs -----"
          docker logs "$id" 2>&1 | tail -25
          docker rm -f "$id" >/dev/null 2>&1 || true
          if [ "$ok" != "1" ]; then
            echo "::error::arc-server image did not serve /metrics within 30s"
            exit 1
          fi
          echo "image booted and served /metrics ✓"
